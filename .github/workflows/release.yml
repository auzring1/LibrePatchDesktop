name: release
# Push a tag such as v0.1.0 to build the installer and the portable exe and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 (the tag v<version> is created)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: go test ./...
      - name: Build exe (no console window)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/librepatchdesktop.exe ./cmd/librepatchdesktop
          Copy-Item dist/librepatchdesktop.exe dist/LibrePatchDesktop-Portable.exe
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\librepatchdesktop.iss
      - name: Checksums
        shell: pwsh
        run: |
          Remove-Item dist/librepatchdesktop.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          prerelease: ${{ startsWith(inputs.version || github.ref_name, '0.') || startsWith(inputs.version || github.ref_name, 'v0.') }}
          files: |
            dist/LibrePatchDesktop-Setup.exe
            dist/LibrePatchDesktop-Portable.exe
            dist/SHA256SUMS.txt
